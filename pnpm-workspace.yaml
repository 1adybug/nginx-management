allowBuilds:
    "@alicloud/openapi-core": true
    "@prisma/engines": true
    better-sqlite3: true
    core-js: false
    prisma: true
    sharp: true
    unrs-resolver: true

minimumReleaseAgeExclude:
    - "@1adybug/eslint"
    - "@1adybug/prettier"
    - "@1adybug/prettier-plugin-block-padding"
    - "@1adybug/prettier-plugin-remove-braces"
    - "@1adybug/prettier-plugin-sort-imports"
    - "@1adybug/xlsx"
    - deepsea-components
    - deepsea-tools
    - sdnext
    - soda-hooks
    - soda-next
    - soda-tanstack-query
    - soda-react
    - soda-type
    - "@better-auth/core@1.7.0"
    - "@better-auth/drizzle-adapter@1.7.0"
    - "@better-auth/kysely-adapter@1.7.0"
    - "@better-auth/memory-adapter@1.7.0"
    - "@better-auth/mongo-adapter@1.7.0"
    - "@better-auth/prisma-adapter@1.7.0"
    - "@better-auth/telemetry@1.7.0"
    - better-auth@1.7.0
